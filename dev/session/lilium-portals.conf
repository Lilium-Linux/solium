# Which xdg-desktop-portal backend answers what in a Solium session (#146).
#
# xdg-desktop-portal reads lilium-portals.conf when XDG_CURRENT_DESKTOP is
# Lilium, which Solium exports (`session::tests`). GTK's backend for
# everything, and xdg-desktop-portal-wlr, over Solium's wlr-screencopy, for
# screen capture. dev/install.sh puts this in ~/.config/xdg-desktop-portal.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
