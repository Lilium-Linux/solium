# Which xdg-desktop-portal backend answers what in a Solium session (#146).
#
# xdg-desktop-portal reads lilium-portals.conf when XDG_CURRENT_DESKTOP is
# Lilium, which Solium exports (`session::tests`). GTK's backend for
# everything, and xdg-desktop-portal-wlr, over Solium's wlr-screencopy, for
# screen capture. dev/install.sh puts this in ~/.config/xdg-desktop-portal, or,
# with a /usr or /usr/local prefix, in <prefix>/share/xdg-desktop-portal.
[preferred]
default=gtk
# Inhibit named, not left to the default: with no GNOME session on the bus,
# GTK's backend passes the portal's Inhibit on to org.freedesktop.ScreenSaver
# (its src/inhibit.c), which Solium owns while idle.dbus_inhibit is on, so a
# program that asks the portal keeps the screens on too. KDE's backend passes
# it to Plasma's power manager instead, which is not running here.
org.freedesktop.impl.portal.Inhibit=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# Secrets for sandboxed apps (Flatpak Slack, Discord, browsers): KDE's wallet,
# which pam_kwallet unlocks at login, else GNOME's keyring. Without a backend
# here the Secret portal fails in this session, and a Flatpak app that keeps
# its login encrypted cannot read it, so it asks you to log in again.
org.freedesktop.impl.portal.Secret=kwallet;gnome-keyring
