<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The showcase's private session bus. No service directories, so nothing is
     activated on it: an application asking for a portal gets no answer rather
     than a second xdg-document-portal, which would mount itself over the
     host's $XDG_RUNTIME_DIR/doc and take it down when this bus ends, and with
     it every Flatpak application of the host session. Solium, the stand-in
     logind and the clients are all started by record.py, not activated. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
