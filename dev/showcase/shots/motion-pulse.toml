title = "pulse"
what = "A titlebar with an animation running in it: a sheen that crosses the focused window's bar and an accent line that breathes, both ordinary QML animations on the compositor's clock."

[stage]
one_group = true
apps = ["log"]
patch = '''
config.pane = "pulse"
'''

[stage.places]
"git log" = [400, 200, 800, 480]

[[at]]
ms = 6200
move = "1400,800"
from = "1400,800"

[[at]]
ms = 7600
move = "860,420"
over = 900

[[at]]
ms = 9400
move = "1400,800"
over = 900

[capture]
from = 7000
to = 11400
loop = true

[out]
webp = 720
poster = 1400
crop = [240, 110, 1120, 630]
