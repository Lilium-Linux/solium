title = "proximity"
what = "A border that wakes as the pointer arrives over the window, and sleeps again as it leaves."

[stage]
one_group = true
apps = ["log"]
patch = '''
config.pane = "proximity"
'''

[stage.places]
"git log" = [400, 200, 800, 480]

[[at]]
ms = 6200
move = "1400,800"
from = "1400,800"

[[at]]
ms = 7400
move = "800,420"
over = 800

[[at]]
ms = 9000
move = "1400,800"
over = 800

[capture]
from = 7000
to = 10600
loop = true

[out]
webp = 720
poster = 1400
crop = [240, 110, 1120, 630]
