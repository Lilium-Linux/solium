name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Smithay links against the system Wayland, input and session stacks.
      # Installed here rather than at the ticket that adds the dependency, so
      # CI does not break the first time a real backend lands.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libinput-dev libudev-dev libseat-dev \
            libxkbcommon-dev libgbm-dev libegl1-mesa-dev libdrm-dev \
            libdisplay-info-dev pkg-config \
            qt6-base-dev qt6-declarative-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # The configuration is Lua, and nothing above this line reads Lua. A
      # syntax error in config.lua compiles, tests and clippies perfectly
      # cleanly, and then the compositor starts with no scripts at all -- no
      # layouts, no bindings, no decorations. That shipped past a green local
      # gate once, which is why `dev/gate.sh` grew this step; CI was still
      # missing the check that was added to catch the bug that motivated it.
      #
      # Needs no display and no GPU: it loads the scripts and reports what
      # bound, then exits.
      - name: Scripts
        run: ./target/debug/solium --check
