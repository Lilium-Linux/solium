name: CI

on:
  push:
    branches: [stage, release]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    # Fedora, not the runner's own Ubuntu, and for the same reason
    # `dev/Containerfile` exists: this project needs Qt 6 Quick >= 6.5 and
    # Ubuntu ships 6.4.2. That is not a version to wait out -- CI failed on
    # every push from the day it was added until this line, always in the
    # build script, always for that one number, while `dev/gate.sh` was green
    # the whole time because it runs in a container that has the right Qt.
    #
    # A CI that tests a different toolchain from the one anybody builds with
    # is not testing the project. Keep this version in step with
    # `dev/Containerfile`'s FEDORA_VERSION.
    container: registry.fedoraproject.org/fedora:44
    steps:
      # Before the checkout: `actions/checkout` uses git when git is there and
      # silently falls back to downloading a tarball when it is not, which
      # works and leaves no history for anything later to look at.
      #
      # The rest is `dev/Containerfile`'s list, minus `foot` -- a terminal is
      # for looking at a running compositor by hand and there is nobody here to
      # look. Smithay links against the system Wayland, input and session
      # stacks, so all of it is needed to compile rather than to run.
      - name: System dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc gcc-c++ make pkgconf-pkg-config \
            wayland-devel libinput-devel systemd-devel libseat-devel \
            libxkbcommon-devel mesa-libgbm-devel mesa-libEGL-devel \
            libdrm-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # The configuration is Lua, and nothing above this line reads Lua. A
      # syntax error in config.lua compiles, tests and clippies perfectly
      # cleanly, and then the compositor starts with no scripts at all -- no
      # layouts, no bindings, no decorations. That shipped past a green local
      # gate once, which is why `dev/gate.sh` grew this step; CI was still
      # missing the check that was added to catch the bug that motivated it.
      #
      # Needs no display and no GPU: it loads the scripts and reports what
      # bound, then exits.
      - name: Scripts
        run: ./target/debug/solium --check

  # The documentation site, built exactly as docs.yml publishes it and not
  # published, so a pull request that breaks a link, a generated reference page
  # or the book itself fails here rather than on `stage`. A push to `stage`
  # builds it in docs.yml instead, which is why this runs on pull requests
  # only. The actions are pinned to commits for docs.yml's reason.
  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: System dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc gcc-c++ make pkgconf-pkg-config \
            wayland-devel libinput-devel systemd-devel libseat-devel \
            libxkbcommon-devel mesa-libgbm-devel mesa-libEGL-devel \
            libdrm-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            python3

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the site
        run: SOLIUM_DOCS_TOOLS="${CARGO_HOME:-$HOME/.cargo}" dev/docs.sh
