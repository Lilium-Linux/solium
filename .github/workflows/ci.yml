name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Smithay links against the system Wayland, input and session stacks.
      # Installed here rather than at the ticket that adds the dependency, so
      # CI does not break the first time a real backend lands.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libinput-dev libudev-dev libseat-dev \
            libxkbcommon-dev libgbm-dev libegl1-mesa-dev libdrm-dev \
            libdisplay-info-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace
