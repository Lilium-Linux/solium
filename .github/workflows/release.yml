name: Release

# A merge to `release` builds, verifies, and attaches a source tarball to a
# DRAFT GitHub Release. Nothing becomes public without a human pressing
# publish -- a release people may already have fetched is unpleasant to
# retract, and a draft costs one click.
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump"
        required: false
        default: minor
        type: choice
        options: [patch, minor, major]

# Read-only by default. The one job that needs to write does so explicitly,
# and only `contents`. No stored secrets are involved anywhere here: the
# automatic GITHUB_TOKEN is scoped to this repository and expires when the
# run ends.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Deliberately a copy of ci.yml's checks rather than a dependency on them.
  # `release` is the branch where being sure matters most, and a release that
  # trusted a green run on some ancestor commit would be trusting a merge
  # nobody tested. It costs a few minutes.
  verify:
    runs-on: ubuntu-latest
    # Fedora, not the runner's Ubuntu: this needs Qt 6 Quick >= 6.5 and Ubuntu
    # ships 6.4.2. Keep in step with dev/Containerfile's FEDORA_VERSION and
    # with ci.yml.
    container: registry.fedoraproject.org/fedora:44
    steps:
      # Before the checkout, because actions/checkout silently downloads a
      # tarball when git is missing, leaving no history for anything later.
      - name: System dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc gcc-c++ make pkgconf-pkg-config \
            wayland-devel libinput-devel systemd-devel libseat-devel \
            libxkbcommon-devel mesa-libgbm-devel mesa-libEGL-devel \
            libdrm-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # Lua is not read by any of the above: a syntax error in config.lua
      # compiles and tests perfectly cleanly, then starts a compositor with no
      # scripts at all. That shipped past a green gate once.
      - name: Scripts
        run: ./target/debug/solium --check

  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: `git archive` below is fine shallow, but a shallow
          # clone has no tags, and the duplicate-tag guard needs to see them.
          fetch-depth: 0

      # The version lives in Cargo.toml, so the tag and what the binary reports
      # at startup cannot disagree -- a release where they differ is a bug
      # report nobody can act on.
      #
      # Bumped here rather than by hand, so merging stage into release is the
      # whole of making a release. **Patch by default on a merge**, because
      # most releases are a handful of fixes and a patch number never promises
      # more than happened. A release that deserves more says so: put `[minor]`
      # or `[major]` in the merge commit's message. Run by hand, the workflow
      # offers the choice and defaults to minor, because a release somebody
      # starts deliberately is usually one with something in it. Over-claiming
      # is the failure that matters -- a user who upgrades 0.1.4 -> 0.1.5 and
      # finds a breaking change was misled, and one who upgrades to 0.2.0 for
      # three bug fixes was not.
      #
      # The first release is 0.1.0 whatever the level says: 0.0.x would claim
      # less than a first release is, and 1.0.0 more.
      - name: Bump the version
        id: version
        run: |
          current=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$current" ]; then
            echo "no version in Cargo.toml" >&2
            exit 1
          fi

          level="${{ github.event.inputs.level }}"
          if [ -z "$level" ]; then
            subject=$(git log -1 --pretty=%B)
            case "$subject" in
              *'[major]'*) level=major ;;
              *'[minor]'*) level=minor ;;
              *)           level=patch ;;
            esac
          fi

          IFS=. read -r major minor patch <<EOF
          $current
          EOF
          case "$level" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "unknown bump level: $level" >&2; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          if [ "$current" = "0.0.0" ]; then
            version="0.1.0"
            level="first release"
          fi

          echo "$current -> $version ($level)"
          # Only the workspace's own version, which is the first `version =`
          # in the file. A dependency's version further down is not ours to
          # touch.
          sed -i "0,/^version *= *\".*\"/s//version    = \"$version\"/" Cargo.toml
          grep -q "^version *= *\"$version\"" Cargo.toml || {
            echo "the bump did not take" >&2; exit 1; }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "level=$level" >> "$GITHUB_OUTPUT"

      # Refuse rather than overwrite, and before anything is pushed. The bump
      # above makes a collision unlikely rather than impossible: a tag made by
      # hand, or a run against a release branch whose bump commit did not land,
      # would both arrive here. Silently
      # replacing the artifact of an existing tag would make one version name
      # two different trees, which is the one thing a version may never do.
      - name: Refuse a version that already exists
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists -- release is out of step with its tags" >&2
            exit 1
          fi

      # The lock file names every workspace crate with its version, so it has to
      # be told about the bump. Without this it still says the old version,
      # and the `cargo build --locked` a distribution's package runs fails on
      # the tarball. `--workspace` touches only the workspace's own entries.
      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh Cargo.lock
        run: |
          cargo update --workspace
          cargo metadata --locked --format-version 1 >/dev/null
          grep -A1 '^name = "solium"$' Cargo.lock \
            | grep -q "^version = \"${{ steps.version.outputs.version }}\"$" || {
              echo "Cargo.lock does not carry ${{ steps.version.outputs.version }}" >&2; exit 1; }

      # Committed back, so `release` always carries the version it published
      # and the next bump counts from it rather than from whatever stage had.
      # Everything after this step builds, tags and describes this commit, not
      # the one the run started from.
      - name: Commit the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "release ${{ steps.version.outputs.tag }} (${{ steps.version.outputs.level }})"
          git push origin HEAD:release

      # The source tarball is the real artifact, and for a compositor that is
      # not a compromise. A vendored C dependency compiles against whatever
      # libc builds it, so a binary built here starts only on a matching
      # glibc; and smithay links the system's libseat, libinput, libdrm and
      # Mesa, which are exactly the libraries that cannot be bundled. Every
      # comparable compositor ships source plus per-distro recipes for the
      # same reasons.
      #
      # `git archive` takes the committed tree only -- no target/, no local
      # edits, no .git -- so what is published is what is in the repository.
      # zstd ships in the GitHub-hosted Ubuntu image, but a release that fails
      # on a missing compressor is a bad way to find out the image changed.
      - name: Ensure zstd
        run: command -v zstd >/dev/null || sudo apt-get install -y zstd

      - name: Source tarball
        run: |
          git archive --format=tar --prefix="solium-${{ steps.version.outputs.version }}/" HEAD \
            | zstd -19 -o "solium-${{ steps.version.outputs.version }}.tar.zst"
          sha256sum "solium-${{ steps.version.outputs.version }}.tar.zst" \
            > "solium-${{ steps.version.outputs.version }}.tar.zst.sha256"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          # The bump commit: the one the tarball was archived from and the one
          # whose Cargo.toml says $version. $GITHUB_SHA is its parent, the
          # merge the verify job tested.
          head="$(git rev-parse HEAD)"
          gh release create "$tag" \
            --draft \
            --target "$head" \
            --title "$tag" \
            --notes "Source release of Solium $version.

          Built from \`$head\`, the version bump on top of \`$GITHUB_SHA\`,
          which is the tree the checks ran on.

          **Installing:** build from source — see the README's Building
          section. An installed copy finds its QML and Lua wherever
          \`SOLIUM_DATADIR\` pointed when it was built, under
          \`share/solium\` beside its \`bin\` directory, or in
          \`/usr/share/solium\`. Per-distro packaging recipes are tracked in
          #66.

          \`\`\`sh
          tar --zstd -xf solium-$version.tar.zst
          cd solium-$version
          cargo build --release
          \`\`\`" \
            "solium-$version.tar.zst" \
            "solium-$version.tar.zst.sha256"
