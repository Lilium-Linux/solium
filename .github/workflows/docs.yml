name: Docs

# The documentation site, https://lilium-linux.github.io/solium/, published on
# every push to `stage` and whenever it is run by hand.
#
# Built by `dev/docs.sh`, the same script a contributor runs, in the same
# Fedora container `ci.yml` builds in: the key-bindings page comes from
# `solium --check` and the Rust internals from rustdoc, so the compositor has
# to build here, with everything that needs. Pull requests build the site in
# `ci.yml` instead, without publishing it.
#
# Every third-party action is pinned to a commit, with its tag beside it: a
# tag can be moved to point at other code, and this workflow can write to the
# site.
#
# Publishing needs the repository's Settings > Pages > Source set to "GitHub
# Actions"; until it is, the deploy job fails. Run by hand from a branch other
# than `stage`, this builds the site and does not publish it.

on:
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push queues behind one in progress rather
# than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep in step with ci.yml, and with dev/Containerfile's FEDORA_VERSION.
    container: registry.fedoraproject.org/fedora:44
    steps:
      # ci.yml's list, plus Python for dev/docs/*.py and tar for the upload.
      # git before the checkout, for ci.yml's reason. The commit the pages'
      # line links point at is GITHUB_SHA, which dev/docs.sh reads, and not
      # git's HEAD: git in a container job may refuse a checkout the runner
      # owns.
      - name: System dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc gcc-c++ make pkgconf-pkg-config \
            wayland-devel libinput-devel systemd-devel libseat-devel \
            libxkbcommon-devel mesa-libgbm-devel mesa-libEGL-devel \
            libdrm-devel \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel \
            pipewire-devel clang-devel \
            pam python3 tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust version
        id: rust
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # mdBook goes into CARGO_HOME, whose bin/ rust-cache keeps, so it is
      # compiled once rather than on every push.
      - name: Build the site
        run: SOLIUM_DOCS_TOOLS="${CARGO_HOME:-$HOME/.cargo}" dev/docs.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    needs: build
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
