[workspace]
members = [
    "crates/animation",
    "crates/effects",
    "crates/layout",
    "crates/solium",
    "crates/wl-probe",
]
# dev/wirecheck is a hardware harness, not part of the compositor: it needs a
# GPU and a Qt installation at *run* time and is driven by dev/gate.sh on its
# own. Excluded so an ordinary `cargo build` at the root does not try to build
# it, and so its dependency tree stays out of the workspace lockfile.
exclude = ["dev/wirecheck"]
resolver = "3"

[workspace.package]
version    = "0.0.0"
edition    = "2024"
# 1.88, not the 1.85 that edition 2024 alone needs: the code uses `if let`
# chains (`if a && let Some(b) = c`), which are stable from 1.88.
rust-version = "1.88"
license    = "GPL-3.0-only"
repository = "https://github.com/Lilium-Linux/solium"

# Lints are set here, once, so a new crate inherits them by writing
# `[lints] workspace = true` rather than restating the list.
[workspace.lints.rust]
unsafe_code               = "warn"
missing_debug_implementations = "warn"
unreachable_pub           = "warn"

[workspace.lints.clippy]
# Denied because a compositor crash takes the session with it: there is no
# supervisor to restart us and nothing to show the user but a black screen.
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
todo        = "deny"

[profile.dev]
# Dependencies are optimised even in dev builds. Smithay's tree is large and a
# compositor that stutters under a debugger teaches nothing about smoothness.
opt-level = 1
# A panic stops the compositor where it happened. Unwinding cannot save a
# session, and unwound past Qt it ran Qt's exit handlers on state the panic had
# left half-dropped: the heap corrupted, and the core dump blamed Qt instead
# of the panic (#283). `main.rs`'s hook logs the panic and its backtrace
# first. Tests are built with unwinding whatever this says, which
# `#[should_panic]` and the Qt test thread rely on.
panic = "abort"

[profile.release]
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
