<!doctype html>
<meta charset="utf-8">
<title>Solium animation preview</title>
<!--
  A test harness for Solium's animation engine. Deliberately plain.

  The boxes are boxes. Recreating the compositor's chrome here would be a second
  copy of its design, drifting from the real one and adding nothing: what needs
  judging is motion, and motion reads more clearly without decoration.

  The engine itself is compiled to WebAssembly and *called* from this page, so
  the timing tuned here is the code that will move real windows. A copy of the
  curves in JavaScript would drift invisibly — the page would still animate
  plausibly. Geometry is this page's own, because that is layout, not animation.

  Regenerate with dev/preview.
-->
<style>
  :root { color-scheme: dark; --bg:#101216; --line:#2a2f3a; --text:#e6e9ef;
          --dim:#848c9c; --box:#7aa2f7; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text);
         font:13px/1.6 system-ui, sans-serif; display:flex; gap:24px;
         flex-wrap:wrap; align-items:flex-start; }
  /* A fixed-width panel. `flex:1` gave it half a 2560px window and sliders a
     metre long. */
  aside { flex:0 0 320px; display:flex; flex-direction:column; gap:14px; }

  #stage { position:relative; width:800px; height:450px; flex:none;
           background:#0a0b0e; border:1px solid var(--line); border-radius:4px;
           overflow:hidden; }
  /* Each box gets its own hue: with more than one window — and with tiling and
     scrolling coming — identical boxes make it impossible to see which window
     went where. */
  .box { position:absolute; border-radius:2px; }

  .field { display:flex; align-items:center; gap:10px; }
  .field label { width:78px; color:var(--dim); }
  .field output { width:58px; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { flex:1; accent-color:var(--box); }
  select { flex:1; background:#0a0b0e; color:var(--text);
           border:1px solid var(--line); border-radius:3px; padding:4px 6px; }
  button { background:transparent; color:var(--text); border:1px solid var(--line);
           border-radius:3px; padding:6px 14px; cursor:pointer; font-size:13px; }
  button.on { border-color:var(--box); color:var(--box); }
  .row { display:flex; gap:8px; }
  /* Sized here, not by its width/height attributes. A flex column stretches
     its children, and a stretched canvas keeps the aspect ratio implied by
     those attributes — so an 280x80 bitmap was being blown up to fill the
     panel and drawn blurry and enormous. */
  #plot { display:block; width:100%; height:80px;
          border:1px solid var(--line); border-radius:3px; }
  #status { color:var(--dim); min-height:1.5em; }
  #config { width:100%; background:#0a0b0e; color:var(--text); resize:vertical;
            border:1px solid var(--line); border-radius:3px; padding:8px;
            font:11px/1.5 monospace; }
  hr { border:0; border-top:1px solid var(--line); margin:2px 0; }
</style>

<div id="stage"></div>

<aside>
  <div class="field"><label for="scenario">scenario</label><select id="scenario"></select></div>
  <div class="field"><label for="count">windows</label>
    <input type="range" id="count" min="1" max="8" step="1" value="3">
    <output id="countOut"></output></div>
  <div class="field"><label for="curve">curve</label><select id="curve"></select></div>
  <div class="field"><label for="duration">duration</label>
    <input type="range" id="duration" min="60" max="1200" step="10" value="260">
    <output id="durationOut"></output></div>
  <div class="field"><label for="speed">speed</label>
    <input type="range" id="speed" min="10" max="100" step="5" value="100">
    <output id="speedOut"></output></div>

  <hr>

  <div class="field"><label for="gap">gap</label>
    <input type="range" id="gap" min="0" max="40" step="1" value="12">
    <output id="gapOut"></output></div>
  <div class="field"><label for="ratio">master</label>
    <input type="range" id="ratio" min="20" max="80" step="1" value="60">
    <output id="ratioOut"></output></div>
  <div class="field"><label for="column">column</label>
    <input type="range" id="column" min="20" max="90" step="1" value="44">
    <output id="columnOut"></output></div>
  <div class="field"><label for="offset">scroll</label>
    <input type="range" id="offset" min="0" max="2000" step="10" value="0">
    <output id="offsetOut"></output></div>

  <hr>

  <div class="field"><label for="stiffness">stiffness</label>
    <input type="range" id="stiffness" min="50" max="900" step="10" value="300">
    <output id="stiffnessOut"></output></div>
  <div class="field"><label for="damping">damping</label>
    <input type="range" id="damping" min="5" max="80" step="1" value="25">
    <output id="dampingOut"></output></div>
  <div class="field"><label for="velocity">throw</label>
    <input type="range" id="velocity" min="-10" max="20" step="0.5" value="0">
    <output id="velocityOut"></output></div>

  <hr>

  <div class="row"><button id="play">Play</button><button id="loop">Loop</button></div>
  <div id="status"></div>
  <canvas id="plot"></canvas>
  <textarea id="config" readonly rows="7" spellcheck="false"
            title="paste into ~/.config/solium/init.lua"></textarea>
</aside>

<script>
"use strict";

// Injected by dev/preview.
const CURVES = /*CURVES*/ null;
const WASM_BASE64 = /*WASM*/ "";
const LAYOUT_BASE64 = /*LAYOUT*/ "";

// Solium's own coordinates, so a scenario reads the way the compositor sees it.
const OUTPUT = { w: 1600, h: 900 };
const BAR = 34, PADDING = 24, SCALE = 800 / OUTPUT.w;

const el = id => document.getElementById(id);
const lerp = (a, b, t) => a + (b - a) * t;
let engine = null, layout = null, springIndex = -1;

/* ---------- the layout engine ---------- */

// Arrangements are read out of the layout module's own memory: it writes them
// into a fixed buffer and returns how many, so nothing is allocated on either
// side of the boundary.
function slots(written) {
  const base = layout.solium_layout_scratch();
  const view = new Float64Array(layout.memory.buffer, base, written * 4);
  const out = [];
  for (let i = 0; i < written; i++) {
    out.push({ x: view[i*4], y: view[i*4+1], w: view[i*4+2], h: view[i*4+3] });
  }
  return out;
}

function writeSizes(sizes) {
  const base = layout.solium_layout_scratch();
  const view = new Float64Array(layout.memory.buffer, base, sizes.length * 4);
  sizes.forEach((s, i) => {
    view[i*4] = s.x; view[i*4+1] = s.y; view[i*4+2] = s.w; view[i*4+3] = s.h;
  });
}

const tuning = () => ({
  gap: +el("gap").value,
  ratio: +el("ratio").value / 100,
  column: +el("column").value / 100,
  offset: +el("offset").value,
});

/* ---------- scenarios: geometry only, never timing ---------- */

const win = (x, y, w, h) => ({ x, y, w, h });

// The same fit overview.lua does: keep the aspect ratio, never enlarge.
function fit(r, box) {
  const scale = Math.min(box.w / r.w, box.h / r.h, 1);
  const w = r.w * scale, h = r.h * scale;
  return { x: box.x + (box.w - w) / 2, y: box.y + (box.h - h) / 2, w, h };
}

function cell(index, count) {
  const columns = Math.max(1, Math.ceil(Math.sqrt(count)));
  const rows = Math.ceil(count / columns);
  const cw = OUTPUT.w / columns, ch = (OUTPUT.h - BAR) / rows;
  return { x: (index % columns) * cw + PADDING,
           y: BAR + Math.floor(index / columns) * ch + PADDING,
           w: cw - PADDING * 2, h: ch - PADDING * 2 };
}

const shrink = w => ({ x: w.x + w.w * 0.06, y: w.y + w.h * 0.06,
                       w: w.w * 0.88, h: w.h * 0.88 });

// Windows at plausible floating positions, which is where a layout starts from.
function floating(count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    out.push(win(120 + i * 150, 110 + (i % 3) * 90, 760 + (i % 2) * 120, 520 + (i % 3) * 60));
  }
  return out;
}

const WORK = { x: 0, y: BAR, w: OUTPUT.w, h: OUTPUT.h - BAR };

// Every arrangement here is computed by the layout engine, not reimplemented.
// The page owns only *which* arrangement and what starts where.
const SCENARIOS = {
  "tiling": () => {
    const from = floating(+el("count").value);
    const t = tuning();
    const to = slots(layout.solium_layout_master_stack(
      from.length, WORK.x, WORK.y, WORK.w, WORK.h, t.gap, t.ratio));
    return from.map((w, i) => ({ from: { ...w, opacity: 1 },
                                 to: { ...to[i], opacity: 1 } }));
  },

  "scrolling": () => {
    const from = floating(+el("count").value);
    const t = tuning();
    const to = slots(layout.solium_layout_scrolling(
      from.length, WORK.x, WORK.y, WORK.w, WORK.h, t.gap, t.column, t.offset));
    return from.map((w, i) => ({ from: { ...w, opacity: 1 },
                                 to: { ...to[i], opacity: 1 } }));
  },

  "overview: enter": () => {
    const from = floating(+el("count").value);
    writeSizes(from);
    const t = tuning();
    const to = slots(layout.solium_layout_grid(
      from.length, WORK.x, WORK.y, WORK.w, WORK.h, 24));
    return from.map((w, i) => ({ from: { ...w, opacity: 1 },
                                 to: { ...to[i], opacity: 1 } }));
  },

  "overview: leave": () => SCENARIOS["overview: enter"]()
    .map(t => ({ from: t.to, to: t.from })),

  "window opens": () => {
    const w = win(430, 220, 740, 520);
    return [{ from: { ...shrink(w), opacity: 0 }, to: { ...w, opacity: 1 } }];
  },

  "window closes": () => {
    const w = win(430, 220, 740, 520);
    return [{ from: { ...w, opacity: 1 }, to: { ...shrink(w), opacity: 0 } }];
  },
};

/* ---------- config, ready to paste ---------- */

function configLines() {
  const t = tuning();
  const curve = CURVES[+el("curve").value];
  const duration = Math.round(durationMs());
  const spring = isSpring()
    ? `\n-- spring: stiffness ${el("stiffness").value}, damping ${el("damping").value}` +
      `, throw ${el("velocity").value} (settles in ${duration}ms)`
    : "";

  return `-- ~/.config/solium/init.lua${spring}
local ANIMATION = { duration = ${duration}, easing = "${curve}" }

local GAP = ${t.gap}
local MASTER = ${t.ratio.toFixed(2)}    -- share of the width for the master window
local COLUMN = ${t.column.toFixed(2)}    -- share of the width for a scrolling column

-- master and stack
local area = sol.monitor()
area.gap, area.ratio = GAP, MASTER
local slots = sol.layout.master_stack(#sol.windows(), area)
sol.animate(ANIMATION)`;
}

/* ---------- the engine: everything about *when* ---------- */

const spring = () => [+el("stiffness").value, +el("damping").value, 1, +el("velocity").value];
const isSpring = () => +el("curve").value === springIndex;

// A spring's duration is a property of the spring, so it is asked for.
const durationMs = () => isSpring()
  ? engine.solium_spring_settle_ms(...spring())
  : +el("duration").value;

const progressAt = ms => isSpring()
  ? engine.solium_spring_at(...spring(), ms / 1000)
  : engine.solium_progress(+el("curve").value, +el("duration").value, ms);

/* ---------- drawing ---------- */

let boxes = [];

function build() {
  const stage = el("stage");
  stage.textContent = "";

  // Spread around the wheel by the golden angle from a random start: random
  // enough to differ run to run, spaced enough that two boxes are never a
  // similar colour, which pure randomness does regularly.
  const base = Math.random() * 360;
  boxes = SCENARIOS[el("scenario").value]().map((track, i) => {
    const node = document.createElement("div");
    node.className = "box";
    node.style.background = `hsl(${(base + i * 137.508) % 360} 62% 64%)`;
    stage.appendChild(node);
    return { track, node };
  });
  place(0);
}

function place(progress) {
  for (const { track: { from, to }, node } of boxes) {
    // Geometry is interpolated here; the engine decided how far along we are.
    node.style.left = (lerp(from.x, to.x, progress) * SCALE) + "px";
    node.style.top = (lerp(from.y, to.y, progress) * SCALE) + "px";
    node.style.width = (lerp(from.w, to.w, progress) * SCALE) + "px";
    node.style.height = (lerp(from.h, to.h, progress) * SCALE) + "px";
    node.style.opacity = lerp(from.opacity, to.opacity, progress);
  }
}

function plot() {
  const canvas = el("plot"), ctx = canvas.getContext("2d");

  // The bitmap is matched to the element's real size at the display's pixel
  // ratio, so the line is crisp instead of a scaled-up 280-pixel one.
  const ratio = window.devicePixelRatio || 1;
  const W = Math.round(canvas.clientWidth), H = Math.round(canvas.clientHeight);
  if (canvas.width !== W * ratio || canvas.height !== H * ratio) {
    canvas.width = W * ratio;
    canvas.height = H * ratio;
  }
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const total = durationMs();
  const samples = Array.from({ length: 201 }, (_, i) => progressAt((i / 200) * total));
  const lo = Math.min(0, ...samples), hi = Math.max(1, ...samples);
  const y = v => H - 6 - ((v - lo) / (hi - lo)) * (H - 12);

  ctx.strokeStyle = "#2a2f3a";
  for (const level of [0, 1]) {
    ctx.beginPath(); ctx.moveTo(0, y(level)); ctx.lineTo(W, y(level)); ctx.stroke();
  }
  ctx.strokeStyle = "#7aa2f7"; ctx.lineWidth = 1.5; ctx.beginPath();
  samples.forEach((v, i) => {
    const x = (i / 200) * W;
    i ? ctx.lineTo(x, y(v)) : ctx.moveTo(x, y(v));
  });
  ctx.stroke();

  const overshoot = Math.max(0, hi - 1);
  el("status").textContent = `${Math.round(total)}ms, ` +
    (overshoot > 0.005 ? `overshoots ${(overshoot * 100).toFixed(1)}%` : "no overshoot");
}

/* ---------- playback ---------- */

let looping = false, playing = false;

function play() {
  if (playing) return;
  playing = true;
  const total = durationMs(), rate = +el("speed").value / 100;
  const started = performance.now();

  (function frame(now) {
    const elapsed = ((now ?? started) - started) * rate;
    place(progressAt(Math.min(elapsed, total)));
    if (elapsed < total) return void requestAnimationFrame(frame);
    playing = false;
    if (looping) setTimeout(() => { place(0); setTimeout(play, 180); }, 380);
  })(started);
}

/* ---------- wiring ---------- */

function boot() {
  for (const name of Object.keys(SCENARIOS)) el("scenario").add(new Option(name, name));
  el("scenario").value = "overview: enter";

  CURVES.forEach((name, index) => {
    el("curve").add(new Option(name, index));
    if (name.startsWith("spring")) springIndex = index;
  });
  el("curve").value = String(Math.max(0, CURVES.indexOf("outCubic")));

  const refresh = () => {
    el("countOut").textContent = el("count").value;
    el("gapOut").textContent = el("gap").value;
    el("ratioOut").textContent = el("ratio").value + "%";
    el("columnOut").textContent = el("column").value + "%";
    el("offsetOut").textContent = el("offset").value;
    el("durationOut").textContent = el("duration").value + "ms";
    el("speedOut").textContent = (+el("speed").value / 100).toFixed(2) + "x";
    for (const id of ["stiffness", "damping", "velocity"]) {
      el(id + "Out").textContent = el(id).value;
    }
    el("duration").disabled = isSpring();
    plot();
    el("config").value = configLines();
  };

  el("scenario").onchange = () => { build(); refresh(); };
  el("curve").onchange = refresh;
  // The plot is sized from the element, so it has to be redrawn when that
  // changes.
  window.addEventListener("resize", plot);
  for (const id of ["duration", "speed", "stiffness", "damping", "velocity"]) {
    el(id).oninput = refresh;
  }
  // A layout parameter changes the arrangement, so the boxes are rebuilt and
  // the change is played rather than jumping — which is the point of tuning a
  // layout here instead of reading numbers.
  for (const id of ["count", "gap", "ratio", "column", "offset"]) {
    el(id).oninput = () => { build(); refresh(); place(1); };
  }
  el("play").onclick = () => { place(0); play(); };
  el("loop").onclick = () => {
    looping = !looping;
    el("loop").classList.toggle("on", looping);
    if (looping) { place(0); play(); }
  };

  build();
  refresh();
}

if (!WASM_BASE64 || !CURVES) {
  el("status").textContent = "no engine embedded — generate with dev/preview";
} else {
  // Embedded rather than fetched: file:// blocks fetching a sibling, and
  // needing a web server to look at an animation is the friction this removes.
  WebAssembly.instantiate(Uint8Array.from(atob(WASM_BASE64), c => c.charCodeAt(0)), {})
    .then(module => { engine = module.instance.exports; boot(); })
    .catch(err => { el("status").textContent = "engine failed to load: " + err; });
}
</script>
