[package]
name        = "solium"
description = "Wayland compositor for Lilium DE"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The animation engine, as a crate so that curves can be tested and previewed
# without a compositor. See crates/animation/preview.
solium-animation = { path = "../animation" }

# The vertex deformations -- genie, and whatever comes after it -- as a crate
# so an effect is a file with unit tests and a preview slider rather than an
# arm of an enum in `present.rs`. See crates/effects.
solium-effects = { path = "../effects" }

# The window arrangements, as a crate so the same code that arranges real
# windows arranges the boxes in the preview. See crates/layout.
solium-layout = { path = "../layout" }

# Wayland plumbing, input and backends. Rendering goes through Smithay's
# renderer traits (GLES2 for now) -- see docs/spikes/2026-08-27-vulkan-on-smithay.md
# for why, and why the transform layer must not reach past those traits.
smithay = { version = "0.7", default-features = false, features = [
    # Nested, for development.
    "backend_winit",
    # On the hardware: DRM for output, libinput for devices, libseat for the
    # session so none of it needs root.
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_egl",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "use_system_lib",
    # X11 clients, through XWayland. Steam, older toolkits, anything Electron
    # that has not been told to use Wayland.
    "xwayland",
] }

# Errors are propagated, never unwrapped: panic is denied at the workspace
# level because a compositor crash takes the session with it.
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }

# XCursor themes: finding one on the icon search path, following what it
# inherits, and parsing the files. Smithay ships no loader of its own, so this
# is the crate everything else in this space already uses -- winit, smithay's
# own anvil example, and `wayland-cursor`, which is how it is already in this
# workspace's lockfile through `wl-probe`. It parses; the choosing -- which
# theme, how big, which of a file's several sizes, and what happens when there
# is no answer -- is `src/cursor/theme.rs`.
xcursor = "0.3"

[build-dependencies]
# Qt Quick is hosted in-process, so a small C++ shim is compiled in. See
# crates/solium/qml/host.cpp for why in-process rather than over a protocol.
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
# A real Wayland client, for `state::tests::scale_resend`. `Window` only
# wraps a real `ToplevelSurface`, and nothing fabricates one except a client
# actually asking for one over the wire -- `wl-probe` (see its own
# `Cargo.toml`) exists for the identical reason. Both already resolve to
# these versions with these features in the lockfile, since `wl-probe`
# depends on them too; this only adds an edge to a graph that does not change.
#
# `staging` because `wp_single_pixel_buffer_v1` (and `xdg_dialog_v1`, which the
# tests were already using) live there. It was reaching these tests anyway,
# unified in through smithay's own dependency on the crate; stating it means
# they compile because they asked for it, not because smithay happens to.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# The client half of `zwlr_screencopy_v1`, for the test that a capture is
# refused while the session is locked. Also already in the lockfile, at this
# version with this feature, through `wl-probe`.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
