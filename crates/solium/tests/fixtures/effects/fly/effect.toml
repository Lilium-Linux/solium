# A geometry whose pixels are another effect's frag: the mesh draws the
# window where it is, and `rounded`'s frag is drawn in the same warp. Its own
# param `lift` is the mesh's; `radius` is `rounded`'s, and a `sol.present`
# deform gives either.
# `state::tests::real_client::a_present_through_a_pixels_effect_reads_the_params_it_blends`,
# `effect::host::tests::a_geometrys_pixels_compile_in_the_warp_and_follow_their_frag`.
api = 2
pixels = "rounded"
grid = [1, 1]
mesh = "flat.vert"

[params]
lift = 0.0
